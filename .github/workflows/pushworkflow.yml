name: Push-workflow
on: 
  push: 
    branches:
      - main
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' #runs at 9.00 
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greetings
        run: echo "print good morning"
      - name: print Goodbye
        run: |
          echo "this is my first GHA workflow"
          echo "Workflow executed successfully"